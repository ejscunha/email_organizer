# fly.toml app configuration file generated for email-organizer-divine-rain-7711 on 2025-03-10T00:18:11Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'email-organizer-divine-rain-7711'
primary_region = 'den'
kill_signal = 'SIGTERM'

[build]

[deploy]
  release_command = '/app/bin/migrate'

[env]
  PHX_HOST = 'email-organizer-divine-rain-7711.fly.dev'
  PORT = '8080'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

  [http_service.concurrency]
    type = 'connections'
    hard_limit = 1000
    soft_limit = 1000

[[vm]]
  size = 'shared-cpu-1x'
